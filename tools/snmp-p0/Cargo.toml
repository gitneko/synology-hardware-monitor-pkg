[package]
name = "hardware-monitor-snmp-p0"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Isolated SNMP interoperability spike; not part of the DSM package"

[workspace]

[features]
product-compat = ["dep:hardware-monitor"]

[dependencies]
anyhow = "1"
async-snmp = { version = "=0.18.1", default-features = false, features = ["crypto-rustcrypto"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "io-std", "sync"] }
zeroize = "1"
hardware-monitor = { path = "../..", optional = true }

[patch.crates-io]
async-snmp = { path = "../../vendor/async-snmp-0.18.1" }
