name: Check and build DSM 7 SPK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --features local-dev -- -D warnings
      - run: cargo build --locked --features local-dev
      - run: python3 tools/local_dev_integration_test.py target/debug/hardware-monitor
      - run: python3 -m unittest discover -s tools/tests -v
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --ignore-scripts
      - run: node --test --test-isolation=none web/tests/*.test.mjs
      - run: npm run build --prefix web
  packages:
    needs: [core, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils curl openssl perl python3
      - name: Build pinned musl toolchain
        run: sh tools/bootstrap_musl.sh
      - name: Build and validate DSM 7 package
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 tools/build_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-spks
          path: dist/current/latest-assets/*
          if-no-files-found: error
          retention-days: 14
  latest:
    needs: packages
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checked-spks
          path: release-assets
      - name: Replace rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 tools/publish_latest.py release-assets
